[project]
name = "stormtrack-ingest-hazards"
version = "0.1.0"
description = "Hazards ingest job for StormTrack Web (CONTRACTS section 3)"
requires-python = ">=3.10"
dependencies = ["boto3"]

[project.scripts]
ingest-hazards = "hazards_ingest.cli:main"
ingest-nowcast = "hazards_ingest.nowcast:main"
ingest-satellite = "hazards_ingest.satellite:main"

[dependency-groups]
dev = ["pytest", "moto[s3]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hazards_ingest"]

[tool.pytest.ini_options]
markers = ["network: live network test (deselect with -m 'not network')"]
addopts = "-m 'not network'"
