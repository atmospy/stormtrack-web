[project]
name = "stormtrack-ingest-wind"
version = "0.1.0"
description = "GFS 10 m wind -> PNG textures + latest.json for StormTrack Web"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pillow>=10",
  "eccodes>=2.42",
  # the native libeccodes: the `eccodes` wheel is pure Python, so without this it needs a system
  # install (Homebrew/apt) and fails on a clean machine such as the CI runner
  "eccodeslib>=2.42; python_version >= '3.10'",
]

[project.optional-dependencies]
upload = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=7", "boto3>=1.34"]

[project.scripts]
ingest-wind = "stormtrack_ingest_wind.cli:main"
verify-wind = "stormtrack_ingest_wind.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormtrack_ingest_wind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real NOAA bucket (deselect with -m 'not network')"]
addopts = "-m 'not network'"
