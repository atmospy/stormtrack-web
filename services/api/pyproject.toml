[project]
name = "stormtrack-api"
version = "0.1.0"
description = "Minimal analysis API for StormTrack Web (wraps the stormtrack library)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "stormtrack[xarray]", "pandas", "numpy", "pyarrow"]

[dependency-groups]
dev = ["pytest", "httpx"]

# Until stormtrack is on PyPI, develop against a local checkout; Docker uses STORMTRACK_SPEC.
[tool.uv.sources]
stormtrack = { path = "/Users/syed44/Git_Stuff/Git_Projects/imdtrack", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormtrack_api"]

[tool.pytest.ini_options]
markers = ["network: live network test (deselect with -m 'not network')"]
addopts = "-m 'not network'"
