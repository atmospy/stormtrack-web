[project]
name = "stormtrack-api"
version = "0.1.0"
description = "Minimal analysis API for StormTrack Web (wraps the stormtrack library)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "stormtrack[xarray]", "pandas", "numpy", "pyarrow"]

[dependency-groups]
dev = ["pytest", "httpx"]

# Until stormtrack is on PyPI it comes from GitHub (branch to be switched to main once that merges).
[tool.uv.sources]
stormtrack = { git = "https://github.com/atmospy/stormtrack", branch = "fix/realtime-robustness" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormtrack_api"]

[tool.pytest.ini_options]
markers = ["network: live network test (deselect with -m 'not network')"]
addopts = "-m 'not network'"
