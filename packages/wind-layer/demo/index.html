<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wind-layer demo</title>
<style>
  html, body, #map { margin: 0; height: 100%; background: #05080f; }
  #ui { position: absolute; top: 10px; left: 10px; z-index: 2; background: rgba(8,12,20,.82); color: #cfe3ff;
        font: 12px/1.5 system-ui, sans-serif; padding: 10px 12px; border-radius: 8px; width: 230px; backdrop-filter: blur(6px); }
  #ui label { display: grid; grid-template-columns: 78px 1fr 48px; align-items: center; gap: 6px; margin: 3px 0; }
  #ui output { text-align: right; font-variant-numeric: tabular-nums; }
  #ui button { margin: 4px 4px 0 0; background:#16233a; color:#cfe3ff; border:1px solid #2b4266; border-radius:4px; padding:3px 8px; cursor:pointer; }
  #stats { margin-top: 6px; font: 11px/1.4 ui-monospace, monospace; color: #8fd; white-space: pre; }
  #probe { position:absolute; bottom:10px; left:10px; z-index:2; color:#cfe3ff; font:12px ui-monospace,monospace; background:rgba(8,12,20,.7); padding:4px 8px; border-radius:6px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="ui">
  <b>@stormtrack/wind-layer</b> <span id="src"></span>
  <label>particles <input id="count" type="range" min="1000" max="262144" step="1000" value="32768" /><output id="countO"></output></label>
  <label>speed <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1" /><output id="speedO"></output></label>
  <label>trail <input id="fade" type="range" min="0.80" max="0.995" step="0.005" value="0.94" /><output id="fadeO"></output></label>
  <label>width <input id="width" type="range" min="0.6" max="5" step="0.2" value="1.4" /><output id="widthO"></output></label>
  <label>blend <input id="mix" type="range" min="0" max="1" step="0.01" value="0" /><output id="mixO"></output></label>
  <button id="proj">mercator</button><button id="rm">reduced motion: off</button><button id="vis">hide</button>
  <button id="auto">auto-blend</button>
  <div id="stats"></div>
</div>
<div id="probe">hover the map: wind probe</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
