name: Ingest (scheduled)

# Publishes data products to Cloudflare R2. Each job builds into a scratch dir and uploads
# ONLY on success, writing the pointer file (latest.json / index.json) last, so a failed or
# cancelled run leaves the previous published data untouched. Nothing here deletes from R2.
#
# Cron rationale (GitHub cron is UTC and can lag 5-30 min under load):
#  * wind: GFS cycles run 00/06/12/18Z and the 0.25 deg files for f000-f072 are complete on
#    the public S3 bucket ~3.5-5 h after the nominal time. We fire every 3 h at :35 past
#    01,04,...,22 UTC. 04:35/10:35/16:35/22:35 are the first attempts for the 00/06/12/18Z
#    cycles (4 h 35 m after nominal; the job itself falls back to the previous complete
#    run); the other slots are cheap retries / no-ops and keep the "every 3 h" cadence.
#  * storms: NHC/JTWC b-decks change at most every 3-6 h, but advisories are issued at
#    irregular times; every 30 min is responsive and cheap.
#  * hazards: USGS quakes update every minute, EONET several times an hour; every 20 min.
#  Minutes are offset from :00 to dodge the top-of-hour scheduling pile-up.

on:
  schedule:
    - cron: "35 1-23/3 * * *" # wind
    - cron: "7,37 * * * *" # storms
    - cron: "13,33,53 * * * *" # hazards
  workflow_dispatch:
    inputs:
      only:
        description: "Run only one job"
        type: choice
        default: all
        options: [all, wind, storms, hazards]

permissions:
  contents: read

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  wind:
    name: Wind (GFS)
    # kill switch: set repository variable INGEST_ENABLED=false. Cron slot is matched by schedule string.
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '35 1-23/3 * * *') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","wind"]'), inputs.only)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ingest-wind
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: echo "present=$([ -f services/ingest/wind/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10
        if: steps.detect.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/wind/uv.lock
      - name: Ingest wind and upload to R2
        if: steps.detect.outputs.present == 'true'
        working-directory: services/ingest/wind
        run: |
          uv sync
          uv run ingest-wind --out "$RUNNER_TEMP/wind" --upload

  storms:
    name: Storms (NHC/JTWC, history)
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '7,37 * * * *') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","storms"]'), inputs.only)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ingest-storms
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: echo "present=$([ -f services/ingest/storms/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10
        if: steps.detect.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/storms/uv.lock
      - name: Ingest storms and upload to R2
        if: steps.detect.outputs.present == 'true'
        working-directory: services/ingest/storms
        run: |
          uv sync
          uv run ingest-storms --out "$RUNNER_TEMP/storms" --upload

  hazards:
    name: Hazards (EONET, USGS, FIRMS)
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '13,33,53 * * * *') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","hazards"]'), inputs.only)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ingest-hazards
      cancel-in-progress: false
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }} # optional; fires.geojson is skipped when empty
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: echo "present=$([ -f services/ingest/hazards/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10
        if: steps.detect.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/hazards/uv.lock
      - name: Ingest hazards and upload to R2
        if: steps.detect.outputs.present == 'true'
        working-directory: services/ingest/hazards
        run: |
          uv sync
          uv run ingest-hazards --out "$RUNNER_TEMP/hazards" --upload
