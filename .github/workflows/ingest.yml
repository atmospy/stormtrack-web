name: Ingest (scheduled)

# Publishes data products to Cloudflare R2. Each job builds into a scratch dir and uploads
# ONLY on success, writing the pointer file (latest.json / index.json) last, so a failed or
# cancelled run leaves the previous published data untouched. Nothing here deletes from R2.
#
# Cron rationale (GitHub cron is UTC and can lag 5-30 min under load):
#  * wind: GFS cycles run 00/06/12/18Z and the 0.25 deg files for f000-f072 are complete on
#    the public S3 bucket ~3.5-5 h after the nominal time. We fire every 3 h at :35 past
#    01,04,...,22 UTC. 04:35/10:35/16:35/22:35 are the first attempts for the 00/06/12/18Z
#    cycles (4 h 35 m after nominal; the job itself falls back to the previous complete
#    run); the other slots are cheap retries / no-ops and keep the "every 3 h" cadence.
#  * storms: NHC/JTWC b-decks change at most every 3-6 h, but advisories are issued at
#    irregular times; every 30 min is responsive and cheap.
#  * storms history/stats (all basins): changes once a season; weekly (Mondays), with the IBTrACS
#    download cache persisted, and on demand. The 30-min storms job only does the ACTIVE storms.
#  * lightning: GOES GLM publishes a file every 20 s; GitHub cron is best-effort (>= 5 min, can lag),
#    so we run every 10 min (the job is incremental) = "a few minutes behind", not real time. The
#    repo is public, so standard runners are free; if it ever goes private these minutes are billed
#    (about 400 a day), so set INGEST_ENABLED=false first.
#  * wind models: each takes ~7 min (GFS, ECMWF IFS, ECMWF AIFS), so the job is ~22 min. One model
#    failing does not stop the others being published; only the job turns red.
#  * GitHub disables scheduled workflows in a public repo after 60 days without repository activity;
#    re-enable them in the Actions tab if that happens.
#  * hazards: USGS quakes update every minute, EONET several times an hour; every 20 min.
#  Minutes are offset from :00 to dodge the top-of-hour scheduling pile-up.

on:
  schedule:
    - cron: "35 1-23/3 * * *" # wind
    - cron: "7,37 * * * *" # storms
    - cron: "13,33,53 * * * *" # hazards
    - cron: "3,13,23,33,43,53 * * * *" # lightning
    - cron: "20 3 * * 1" # storm history, weekly
  workflow_dispatch:
    inputs:
      only:
        description: "Run only one job"
        type: choice
        default: all
        options: [all, wind, storms, hazards, lightning, history]
      models:
        description: "Wind models: comma list of gfs, ecmwf-ifs, ecmwf-aifs (scheduled runs use all three)"
        type: string
        default: gfs,ecmwf-ifs,ecmwf-aifs

permissions:
  contents: read

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  wind:
    name: Wind (GFS)
    # kill switch: set repository variable INGEST_ENABLED=false. Cron slot is matched by schedule string.
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '35 1-23/3 * * *') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","wind"]'), inputs.only)))
    runs-on: ubuntu-latest
    timeout-minutes: 45 # GFS alone takes ~7 min; ECMWF IFS and AIFS add ~7 min each
    concurrency:
      group: ingest-wind
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: echo "present=$([ -f services/ingest/wind/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        if: steps.detect.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/wind/uv.lock
      - name: Ingest wind and upload to R2
        if: steps.detect.outputs.present == 'true'
        working-directory: services/ingest/wind
        env:
          MODELS: ${{ inputs.models || 'gfs,ecmwf-ifs,ecmwf-aifs' }} # passed through env, not interpolated into the script
        run: |
          uv sync
          uv run ingest-wind --models "$MODELS" --out "$RUNNER_TEMP/wind" --upload

  storms:
    name: Storms (active, NHC/JTWC)
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '7,37 * * * *') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","storms"]'), inputs.only)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ingest-storms
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: echo "present=$([ -f services/ingest/storms/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        if: steps.detect.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/storms/uv.lock
      - name: Ingest storms and upload to R2
        if: steps.detect.outputs.present == 'true'
        working-directory: services/ingest/storms
        env:
          PUBLIC_DATA_BASE: ${{ vars.PUBLIC_DATA_BASE }}
        run: |
          uv sync
          uv run ingest-storms --only active --out "$RUNNER_TEMP/storms" ${PUBLIC_DATA_BASE:+--prev-url "$PUBLIC_DATA_BASE"} --upload

  hazards:
    name: Hazards (EONET, USGS, FIRMS, IMD nowcast and satellite)
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '13,33,53 * * * *') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","hazards"]'), inputs.only)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ingest-hazards
      cancel-in-progress: false
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }} # optional; fires.geojson is skipped when empty
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: echo "present=$([ -f services/ingest/hazards/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        if: steps.detect.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/hazards/uv.lock
      - name: Ingest hazards and upload to R2
        if: steps.detect.outputs.present == 'true'
        working-directory: services/ingest/hazards
        run: |
          uv sync
          uv run ingest-hazards --out "$RUNNER_TEMP/hazards" --upload
      - name: Ingest India district nowcast warnings (IMD) and upload to R2
        # separate from the hazards step so IMD being unreachable never fails the quake and event layers
        if: steps.detect.outputs.present == 'true'
        continue-on-error: true
        working-directory: services/ingest/hazards
        run: uv run ingest-nowcast --out "$RUNNER_TEMP/hazards" --upload
      - name: Ingest INSAT infrared image (IMD) and upload to R2
        if: steps.detect.outputs.present == 'true'
        continue-on-error: true
        working-directory: services/ingest/hazards
        env:
          PUBLIC_DATA_BASE: ${{ vars.PUBLIC_DATA_BASE }}
        run: uv run ingest-satellite --out "$RUNNER_TEMP/hazards" ${PUBLIC_DATA_BASE:+--prev-url "$PUBLIC_DATA_BASE"} --upload

  lightning:
    name: Lightning (GOES GLM)
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '3,13,23,33,43,53 * * * *') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","lightning"]'), inputs.only)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ingest-lightning
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/lightning/uv.lock
      # Stateless runner: the previous flashes/index are read back from the public data URL so the
      # job only downloads files newer than the last published run (see services/ingest/README.md).
      - name: Ingest lightning and upload to R2
        working-directory: services/ingest/lightning
        env:
          PUBLIC_DATA_BASE: ${{ vars.PUBLIC_DATA_BASE }}
        run: |
          uv sync
          uv run ingest-lightning --source goes-glm,imd-lightning --out "$RUNNER_TEMP/lightning" ${PUBLIC_DATA_BASE:+--prev-url "$PUBLIC_DATA_BASE"} --upload

  storm-history:
    name: Storm history and stats (all basins)
    if: >-
      vars.INGEST_ENABLED != 'false' &&
      ((github.event_name == 'schedule' && github.event.schedule == '20 3 * * 1') ||
       (github.event_name == 'workflow_dispatch' && inputs.only == 'history'))
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a cold run downloads ~360 MB of IBTrACS CSVs
    concurrency:
      group: ingest-storm-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/ingest/storms/uv.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stormtrack-web/ibtracs
          key: ibtracs-${{ github.run_id }}
          restore-keys: ibtracs-
      - name: Ingest history and stats, upload to R2
        working-directory: services/ingest/storms
        env:
          PUBLIC_DATA_BASE: ${{ vars.PUBLIC_DATA_BASE }}
        run: |
          uv sync
          uv run ingest-storms --only history --basin all --out "$RUNNER_TEMP/storms-history" ${PUBLIC_DATA_BASE:+--prev-url "$PUBLIC_DATA_BASE"} --upload
