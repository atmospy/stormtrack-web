name: Deploy web (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "infra/cloudflare/_headers"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "infra/cloudflare/_headers"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs get no secrets; skip them rather than fail. Production = pushes to main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter web build
        env:
          # All PUBLIC_* values are shipped to browsers by design: store them as repository
          # *variables*, never secrets. (The Supabase anon key is safe to expose; RLS guards data.)
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_DATA_BASE: ${{ vars.PUBLIC_DATA_BASE }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Budget gate
        run: node .github/scripts/check-js-budget.mjs apps/web/build --budget-kb 150
      - name: Ensure _headers is shipped
        run: |
          [ -f apps/web/build/_headers ] || cp infra/cloudflare/_headers apps/web/build/_headers
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # PR/branch builds become preview deployments (branch != the project's production branch)
          command: >-
            pages deploy apps/web/build
            --project-name=${{ vars.CF_PAGES_PROJECT || 'stormtrack-web' }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
